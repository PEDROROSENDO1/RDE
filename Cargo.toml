[workspace]
resolver = "3"
members = [
    "crates/rocketde-core",
    "crates/rocketde-ui-common",
    "apps/rocketde",
    "apps/rocketde-settings",
    "apps/rocketde-files",
    "apps/rocketde-editor",
    "apps/rocketde-tasks",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
rocketde-core = { path = "crates/rocketde-core" }
rocketde-ui-common = { path = "crates/rocketde-ui-common" }

bytemuck = { version = "1.25.2", features = ["derive"] }
calloop = "0.14.5"
calloop-wayland-source = "0.4.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
fuzzy-matcher = "0.3.7"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "ico", "bmp", "gif"] }
libc = "0.2.191"
notify = "8.2.2"
pollster = "1.0.1"
raw-window-handle = "0.6.2"
resvg = "0.50.0"
ron = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = { version = "0.21.1", features = ["system"] }
sysinfo = "0.40.3"
tiny-skia = "0.12.0"
toml = "1.2.1"
wayland-backend = "0.3.17"
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "unstable", "staging"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wgpu = "30.0.2"
xkbcommon = "0.9.0"

# Maximum performance configuration for Release builds
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

[profile.release.package."*"]
opt-level = 3

[profile.release.build-override]
opt-level = 3

# High performance for dependencies during development (smooth 144Hz+ egui rendering)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
